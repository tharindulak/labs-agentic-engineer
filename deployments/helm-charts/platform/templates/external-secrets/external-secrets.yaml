{{- if not .Values.localSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aep-thunder-admin-creds
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aep-platform
    kind: ClusterSecretStore
  target:
    name: aep-thunder-admin-creds
  data:
    - secretKey: client-id
      remoteRef:
        key: aep/thunder-admin/client-id
        property: value
    - secretKey: client-secret
      remoteRef:
        key: aep/thunder-admin/client-secret
        property: value
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aep-agents-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aep-platform
    kind: ClusterSecretStore
  target:
    name: aep-agents-secrets
  data:
    # No ANTHROPIC_API_KEY: the agents service builds its model per turn from
    # X-Anthropic-Key (the caller org's connected credential). aep/anthropic-api-key
    # in OpenBao still backs the observability plane's RCA agent.
    - secretKey: AGENTS_JWT_SECRET
      remoteRef:
        key: aep/agents-jwt-secret
        property: value
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aep-webhook-secrets
  namespace: {{ .Release.Namespace }}
spec:
