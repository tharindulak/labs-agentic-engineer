---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aep-oauth-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aep-platform
    kind: ClusterSecretStore
  target:
    name: aep-oauth-secrets
  data:
    - secretKey: OAUTH_STATE_SIGNING_KEY
      remoteRef:
        key: aep/oauth-state-key
