---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aep-thunder-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aep-platform
    kind: ClusterSecretStore
  target:
    name: aep-thunder-secrets
  data:
    - secretKey: OC_WORKLOAD_PUBLISHER_SECRET
      remoteRef:
        key: aep/thunder-clients/oc-workload-publisher
        property: value
    - secretKey: OC_OBSERVER_READER_SECRET
      remoteRef:
        key: aep/thunder-clients/oc-observer-reader
        property: value
    - secretKey: AEP_API_CLIENT_SECRET
      remoteRef:
        key: aep/thunder-clients/aep-api-client
        property: value
    - secretKey: BFF_TO_GIT_SERVICE_SECRET
      remoteRef:
        key: aep/thunder-clients/bff-git-service
        property: value
    - secretKey: BFF_TO_REMOTE_WORKER_SECRET
      remoteRef:
        key: aep/thunder-clients/bff-remote-worker
        property: value
    - secretKey: LOCAL_DEV_SEEDER_SECRET
      remoteRef:
        key: aep/thunder-clients/local-dev-seeder
        property: value
    - secretKey: THUNDER_SYSTEM_CLIENT_SECRET
      remoteRef:
        key: aep/thunder-clients/system-client
        property: value
    - secretKey: OC_RCA_AGENT_SECRET
      remoteRef:
        key: aep/thunder-clients/openchoreo-rca-agent
        property: value
---
# Same OpenBao path as the obs-namespace ExternalSecret that
# tools/aectl/cmd/sre_assets.go's sreSecretsTmpl creates (aep/aep-mcp-token) —
# aep-api (this namespace) and the RCA/remediation pod (the obs namespace)
# each need their own copy of the synced value, since ESO cannot share a
# Secret object across namespaces. NOT yet seeded by `aectl init`
# (aep/anthropic-api-key is the only path it seeds today) — a manual OpenBao
# write is required until init is extended; see aep-api/deployment.yaml's
# SRE_MCP_TOKEN env, which tolerates this Secret being absent via
# optional: true.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aep-mcp-token
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aep-platform
    kind: ClusterSecretStore
  target:
    name: aep-mcp-token
  data:
    - secretKey: AEP_MCP_TOKEN
      remoteRef:
        key: aep/aep-mcp-token
        property: value
{{- end }}
